
services:
  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    ports:
      - "3004:3000"
    restart: unless-stopped

  
  orders-service:
    build: ./orders-service
    container_name: orders-service
    ports:
      - "3005:3001"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD} 
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped


  
  payments-service:
    build: ./payments-service
    container_name: payments-service
    ports:
      - "3006:3002"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD} 
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped


  inventory-service:
    build: ./inventory-service
    container_name: inventory-service
    ports:
      - "3007:3003"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD} 
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped


  db:
    image: postgres:16-alpine
    container_name: pedidosveloz-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER:  ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pedidos_user -d pedidos_veloz"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
