
name: PedidosVeloz CI-CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build-and-publish:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api-gateway
            path: api-gateway
          - service: orders-service
            path: orders-service
          - service: payments-service
            path: payments-service
          - service: inventory-service
            path: inventory-service

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.path }}/package-lock.json

      - name: Instalar dependencias
        working-directory: ${{ matrix.path }}
        run: npm ci

      - name: Verificar sintaxe
        working-directory: ${{ matrix.path }}
        run: node --check server.js

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir e publicar imagem
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.path }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/pedidos-veloz-${{ matrix.service }}:latest
            ghcr.io/${{ github.repository_owner }}/pedidos-veloz-${{ matrix.service }}:${{ github.sha }}
